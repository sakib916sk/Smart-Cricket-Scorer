name: cricket_crushers
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  uuid: ^4.2.0
  audioplayers: 6.8.1
  lottie: ^2.7.0
  image_picker: ^1.0.4
  flutter_image_compress: 2.3.0
  flutter_tts: ^4.0.2
  pdf: ^3.12.0
  share_plus: ^10.1.4
  open_filex: ^4.6.0
  printing: ^5.14.3
  video_player: ^2.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/schema.sql
    - assets/sounds/
    #- assets/animations/  # <-- animations ফোল্ডার যুক্ত করা হলো

# --- লঞ্চার আইকন সেটিংস ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.png" 
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"